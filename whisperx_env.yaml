name: whisperx
channels:
  - nvidia
  - pytorch
  - conda-forge
  - defaults
channel_priority: strict

dependencies:
  - python=3.10
  - pip
  - pytorch=2.2.2
  - pytorch-cuda=12.1
  - torchvision
  - torchaudio
  - ffmpeg
  - libzlib
  - openssl
  - readline
  - sqlite
  - setuptools
  - wheel
  - tk
  - xz
  - zlib
  - ncurses

  # Move as many pip packages to conda-forge
  - numpy=1.26.4
  - librosa=0.10.2
  - tqdm=4.67.0
  - transformers=4.46.3
  - huggingface_hub=0.26.2
  - typing-extensions=4.12.2
  - filelock=3.16.1
  - certifi=2024.8.30
  - charset-normalizer=3.4.0
  - idna=3.10
  - requests=2.32.3
  - pyyaml=6.0.2
  - pandas
  - nltk

  # Pip-only packages
